name: Dependabot alert diagnostic

on:
  push:
    branches:
      - fix/dependabot-105

permissions:
  contents: read
  security-events: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot alert 105
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts/105"
